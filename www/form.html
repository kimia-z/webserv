<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact Form - Webserv</title>
	<link rel="icon" type="image/x-icon" href="favicon.png">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
		
		:root {
			--primary-color: #2c3e50;
			--secondary-color: #3498db;
			--accent-color: #e74c3c;
			--text-color: #f4f4f4;
			--bg-color: #ecf0f1;
			--card-bg: #ffffff;
			--shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
		}

		body {
			font-family: 'Poppins', sans-serif;
			background-color: var(--bg-color);
			margin: 0;
			padding: 0;
			color: var(--primary-color);
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
		}

		.container {
			background-color: var(--card-bg);
			padding: 3rem 4rem;
			border-radius: 16px;
			box-shadow: var(--shadow);
			width: 100%;
			max-width: 500px;
			transform: translateY(0);
			transition: transform 0.5s ease-in-out, box-shadow 0.5s ease;
		}
		
		.container:hover {
			transform: translateY(-8px);
			box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
		}

		h1 {
			font-size: 3rem;
			font-weight: 700;
			color: var(--secondary-color);
			margin: 0 0 0.5rem;
			letter-spacing: -2px;
			text-align: center;
		}

		h2 {
			font-size: 1.8rem;
			color: var(--primary-color);
			margin: 0 0 2rem;
			font-weight: 600;
			text-align: center;
		}

		form {
			display: flex;
			flex-direction: column;
			gap: 1.5rem;
		}

		.form-group {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		label {
			font-weight: 600;
			color: var(--primary-color);
			font-size: 1rem;
		}

		input[type="text"], input[type="tel"], input[type="email"] {
			padding: 1rem;
			border: 2px solid #ddd;
			border-radius: 8px;
			font-size: 1rem;
			font-family: 'Poppins', sans-serif;
			transition: border-color 0.3s ease, box-shadow 0.3s ease;
		}

		input[type="text"]:focus, input[type="tel"]:focus, input[type="email"]:focus {
			outline: none;
			border-color: var(--secondary-color);
			box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
		}

		input[type="submit"] {
			background-color: var(--secondary-color);
			color: white;
			padding: 1rem 2rem;
			border: none;
			border-radius: 8px;
			font-size: 1.1rem;
			font-weight: 600;
			font-family: 'Poppins', sans-serif;
			cursor: pointer;
			transition: background-color 0.3s ease, transform 0.2s ease;
		}

		input[type="submit"]:hover {
			background-color: #2980b9;
			transform: translateY(-2px);
		}
		.back-link {
			text-align: center;
			margin-top: 2rem;
		}
		.back-link a {
			color: var(--secondary-color);
			text-decoration: none;
			font-weight: 600;
			transition: color 0.3s ease;
		}

		.back-link a:hover {
			color: var(--accent-color);
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>📝</h1>
		<h2>Leave your contact details</h2>
		<form action="/cgi-bin/form.py" method="post">
			<div class="form-group">
				<label for="name">Name:</label>
				<input type="text" id="name" name="name" required>
			</div>
			<div class="form-group">
				<label for="phone">Phone number (insert only digits):</label>
				<input type="tel" id="phone" name="phone" pattern="[0-9]+" required>
			</div>
			<div class="form-group">
				<label for="email">Email address:</label>
				<input type="email" id="email" name="email" required>
			</div>

			<input type="submit" value="Submit">
		</form>
		<div class="back-link">
			<a href="/index.html">← Back to Homepage</a>
		</div>
	</div>
</body>
</html>
