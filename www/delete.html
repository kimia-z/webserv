<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Delete Uploaded File - Webserv</title>
	<link rel="icon" type="image/x-icon" href="images/favicon.ico">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

		:root {
			--primary-color: #2c3e50;
			--secondary-color: #3498db;
			--accent-color: #e74c3c;
			--text-color: #f4f4f4;
			--bg-color: #ecf0f1;
			--card-bg: #ffffff;
			--shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
		}

		body {
			font-family: 'Poppins', sans-serif;
			background-color: var(--bg-color);
			margin: 0;
			padding: 0;
			color: var(--primary-color);
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			text-align: center;
		}

		.container {
			background-color: var(--card-bg);
			padding: 3rem 4rem;
			border-radius: 16px;
			box-shadow: var(--shadow);
			width: 100%;
			max-width: 700px;
			transform: translateY(0);
			transition: transform 0.5s ease-in-out, box-shadow 0.5s ease;
		}

		.container:hover {
			transform: translateY(-8px);
			box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
		}

		h1 {
			font-size: 4rem;
			font-weight: 700;
			color: var(--secondary-color);
			margin: 0 0 0.5rem;
			letter-spacing: -2px;
			position: relative;
			animation: bounceIn 1s ease-out;
		}

		h2 {
			font-size: 1.8rem;
			color: var(--primary-color);
			margin: 0 0 2rem;
			font-weight: 600;
		}

		p {
			font-size: 1.1rem;
			line-height: 1.8;
			margin: 0 0 2.5rem;
		}

		form {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 1.5rem;
		}

		input[type="text"] {
			padding: 0.8rem 1rem;
			border-radius: 8px;
			border: 1px solid #ccc;
			width: 80%;
			font-size: 1rem;
		}

		input[type="submit"] {
			padding: 0.8rem 2rem;
			border-radius: 8px;
			border: none;
			background-color: var(--accent-color);
			color: white;
			font-weight: 600;
			font-size: 1rem;
			cursor: pointer;
			transition: background-color 0.3s ease;
		}

		input[type="submit"]:hover {
			background-color: #c0392b;
		}

		.footer {
			margin-top: 3rem;
			font-size: 0.9rem;
			color: #7f8c8d;
			border-top: 1px solid #ddd;
			padding-top: 2rem;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>Delete Uploaded File 🗑️</h1>
		<h2>Enter the exact filename to remove</h2>
		<p>Please type the exact name of the file from the <code>upload/</code> folder to delete it permanently.</p>

		<form id="deleteForm" method="POST" action="/cgi-bin/delete.py">
    	<input type="text" name="DELETE_TARGET" placeholder="Filename (e.g., myphoto.jpg)" required>
    	<input type="submit" value="Delete File">
		</form>
		<div id="deleteResult"></div>

		<div class="footer">
			Proudly served by our very own `webserv`.
		</div>
	</div>
</body>
</html>
