<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Upload File - Webserv</title>
	<link rel="icon" type="image/x-icon" href="favicon.png">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
		
		:root {
			--primary-color: #2c3e50;
			--secondary-color: #3498db;
			--accent-color: #e74c3c;
			--text-color: #f4f4f4;
			--bg-color: #ecf0f1;
			--card-bg: #ffffff;
			--shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
		}

		body {
			font-family: 'Poppins', sans-serif;
			background-color: var(--bg-color);
			margin: 0;
			padding: 0;
			color: var(--primary-color);
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
		}

		.container {
			background-color: var(--card-bg);
			padding: 3rem 4rem;
			border-radius: 16px;
			box-shadow: var(--shadow);
			width: 100%;
			max-width: 500px;
			transform: translateY(0);
			transition: transform 0.5s ease-in-out, box-shadow 0.5s ease;
		}
		
		.container:hover {
			transform: translateY(-8px);
			box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
		}

		h1 {
			font-size: 3rem;
			font-weight: 700;
			color: var(--secondary-color);
			margin: 0 0 0.5rem;
			letter-spacing: -2px;
			text-align: center;
		}

		h2 {
			font-size: 1.8rem;
			color: var(--primary-color);
			margin: 0 0 2rem;
			font-weight: 600;
			text-align: center;
		}

		form {
			display: flex;
			flex-direction: column;
			gap: 1.5rem;
		}

		.form-group {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		label {
			font-weight: 600;
			color: var(--primary-color);
			font-size: 1rem;
		}

		input[type="file"] {
			padding: 1rem;
			border: 2px dashed #ddd;
			border-radius: 8px;
			font-size: 1rem;
			font-family: 'Poppins', sans-serif;
			transition: border-color 0.3s ease, box-shadow 0.3s ease;
			background-color: #f8f9fa;
		}

		input[type="file"]:hover {
			border-color: var(--secondary-color);
		}

		input[type="submit"] {
			background-color: var(--secondary-color);
			color: white;
			padding: 1rem 2rem;
			border: none;
			border-radius: 8px;
			font-size: 1.1rem;
			font-weight: 600;
			font-family: 'Poppins', sans-serif;
			cursor: pointer;
			transition: background-color 0.3s ease, transform 0.2s ease;
		}

		input[type="submit"]:hover {
			background-color: #2980b9;
			transform: translateY(-2px);
		}

		input[type="submit"]:disabled {
			background-color: #bdc3c7;
			cursor: not-allowed;
			transform: none;
		}

		.message {
			padding: 1rem;
			border-radius: 8px;
			font-weight: 600;
			text-align: center;
			margin-bottom: 1rem;
		}

		.error {
			background-color: #f8d7da;
			color: #721c24;
			border: 1px solid #f5c6cb;
		}

		.success {
			background-color: #d4edda;
			color: #155724;
			border: 1px solid #c3e6cb;
		}

		.loading {
			background-color: #d1ecf1;
			color: #0c5460;
			border: 1px solid #bee5eb;
		}

		.back-link {
			text-align: center;
			margin-top: 2rem;
		}

		.back-link a {
			color: var(--secondary-color);
			text-decoration: none;
			font-weight: 600;
			transition: color 0.3s ease;
		}

		.back-link a:hover {
			color: var(--accent-color);
		}

		.file-info {
			font-size: 0.9rem;
			color: #666;
			text-align: center;
			margin-top: 0.5rem;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>📁</h1>
		<h2>Upload your file</h2>
		<div id="error" class="message error" style="display: none;"></div>
		<div id="success" class="message success" style="display: none;"></div>
		<div id="loading" class="message loading" style="display: none;">Uploading... Please wait.</div>

		<form id="uploadForm" action="/upload/upload.py" method="POST" enctype="multipart/form-data">
			<input type="hidden" name="MAX_FILE_SIZE" value="10485760">
			<div class="form-group">
				<label for="fileInput">Choose a file to upload:</label>
				<input type="file" name="file" required id="fileInput">
				<div class="file-info">Maximum file size: 10MB</div>
			</div>
			<input type="submit" value="Upload File" id="submitBtn">
		</form>
		<div class="back-link">
			<a href="/index.html">← Back to Homepage</a>
		</div>
	</div>

	<script>
	document.getElementById('uploadForm').addEventListener('submit', function(e) {
		document.getElementById('loading').style.display = 'block';
		document.getElementById('error').style.display = 'none';
		document.getElementById('success').style.display = 'none';
		document.getElementById('submitBtn').disabled = true;
		
		const fileInput = document.getElementById('fileInput');
		const file = fileInput.files[0];
		if (file && file.size > 10485760) {
			e.preventDefault();
			document.getElementById('loading').style.display = 'none';
			document.getElementById('error').style.display = 'block';
			document.getElementById('error').textContent = 'File too large! Maximum file size is 10MB.';
			document.getElementById('submitBtn').disabled = false;
			return;
		}
	});
	window.addEventListener('load', function() {
		if (window.location.pathname.includes('error') || document.title.includes('Error')) {
			document.getElementById('error').style.display = 'block';
			document.getElementById('error').textContent = 'Upload failed! Please try again.';
		}
	});
	</script>
</body>
</html>
