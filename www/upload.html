<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload the file</title>
</head>
<body>
<h2>Upload your file</h2>
<div id="error" style="color: red; display: none;"></div>
<div id="success" style="color: green; display: none;"></div>
<div id="loading" style="display: none;">Uploading... Please wait.</div>

<form id="uploadForm" action="/upload/upload.py" method="POST" enctype="multipart/form-data">
	<input type="hidden" name="MAX_FILE_SIZE" value="10485760">
	<input type="file" name="file" required id="fileInput"><br><br>
	<input type="submit" value="Submit" id="submitBtn">
</form>

<script>
document.getElementById('uploadForm').addEventListener('submit', function(e) {
	// Show loading message
	document.getElementById('loading').style.display = 'block';
	document.getElementById('error').style.display = 'none';
	document.getElementById('success').style.display = 'none';
	document.getElementById('submitBtn').disabled = true;
	
	// Check file size before upload
	const fileInput = document.getElementById('fileInput');
	const file = fileInput.files[0];
	if (file && file.size > 10485760) { // 10MB
		e.preventDefault();
		document.getElementById('loading').style.display = 'none';
		document.getElementById('error').style.display = 'block';
		document.getElementById('error').textContent = 'File too large! Maximum file size is 10MB.';
		document.getElementById('submitBtn').disabled = false;
		return;
	}
});

// Handle form submission response
window.addEventListener('load', function() {
	// Check if we're on an error page
	if (window.location.pathname.includes('error') || document.title.includes('Error')) {
		document.getElementById('error').style.display = 'block';
		document.getElementById('error').textContent = 'Upload failed! Please try again.';
	}
});
</script>
</body>
</html>
