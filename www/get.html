<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Check Your Contact Details - Webserv</title>
	<link rel="icon" type="image/x-icon" href="favicon.png">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
		
		:root {
			--primary-color: #2c3e50;
			--secondary-color: #3498db;
			--accent-color: #e74c3c;
			--success-color: #27ae60;
			--text-color: #f4f4f4;
			--bg-color: #ecf0f1;
			--card-bg: #ffffff;
			--shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
		}

		body {
			font-family: 'Poppins', sans-serif;
			background-color: var(--bg-color);
			margin: 0;
			padding: 0;
			color: var(--primary-color);
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
		}

		.container {
			background-color: var(--card-bg);
			padding: 3rem 4rem;
			border-radius: 16px;
			box-shadow: var(--shadow);
			width: 100%;
			max-width: 600px;
			transform: translateY(0);
			transition: transform 0.5s ease-in-out, box-shadow 0.5s ease;
		}
		
		.container:hover {
			transform: translateY(-8px);
			box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
		}

		h1 {
			font-size: 3rem;
			font-weight: 700;
			color: var(--secondary-color);
			margin: 0 0 0.5rem;
			letter-spacing: -2px;
			text-align: center;
		}

		h2 {
			font-size: 1.8rem;
			color: var(--primary-color);
			margin: 0 0 2rem;
			font-weight: 600;
			text-align: center;
		}

		p {
			font-size: 1.1rem;
			line-height: 1.8;
			margin: 0 0 2rem;
			text-align: center;
		}

		.form-container {
			background-color: var(--bg-color);
			padding: 2rem;
			border-radius: 12px;
			margin: 2rem 0;
			border-left: 4px solid var(--secondary-color);
		}

		.form-group {
			margin-bottom: 1.5rem;
		}

		label {
			display: block;
			font-weight: 600;
			margin-bottom: 0.5rem;
			color: var(--primary-color);
		}

		input[type="text"], input[type="email"], input[type="tel"] {
			width: 100%;
			padding: 1rem;
			border: 2px solid #ddd;
			border-radius: 8px;
			font-size: 1rem;
			transition: border-color 0.3s ease;
			box-sizing: border-box;
			font-family: 'Poppins', sans-serif;
		}

		input[type="text"]:focus, input[type="email"]:focus, input[type="tel"]:focus {
			outline: none;
			border-color: var(--secondary-color);
		}

		.btn {
			background-color: var(--secondary-color);
			color: white;
			border: none;
			padding: 1rem 2rem;
			border-radius: 8px;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s ease;
			text-decoration: none;
			display: inline-block;
			margin: 0.5rem;
			width: 100%;
		}

		.btn:hover {
			background-color: #2980b9;
			transform: translateY(-2px);
		}

		.btn.success {
			background-color: var(--success-color);
		}

		.btn.success:hover {
			background-color: #229954;
		}

		.search-info {
			background-color: #e8f4fd;
			padding: 1rem;
			border-radius: 8px;
			margin: 1rem 0;
			border-left: 4px solid var(--secondary-color);
			font-size: 0.9rem;
			color: var(--primary-color);
		}

		.back-link {
			text-align: center;
			margin-top: 2rem;
		}
		.back-link a {
			color: var(--secondary-color);
			text-decoration: none;
			font-weight: 600;
			transition: color 0.3s ease;
		}
		.back-link a:hover {
			color: var(--accent-color);
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>🔍</h1>
		<h2>View Your Contact Details</h2>
		<p>Enter your phone number or email address</p>
		
		<div class="form-container">
			<form action="/cgi-bin/get.py" method="GET">
				<div class="form-group">
					<label for="search_term">Phone or Email:</label>
					<input type="text" id="search_term" name="search_term" placeholder="Enter phone number or email address..." required>
				</div>	
				<button type="submit" class="btn success">🔍 View Your Details</button>
			</form>
		</div>
		<div class="back-link">
			<a href="/index.html">← Back to Homepage</a>
		</div>
	</div>
</body>
</html>
